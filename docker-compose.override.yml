# Ajustes LOCAIS de desenvolvimento (arquivo nao versionado no upstream).
#
# 1. O compose do repo nao publica a porta do Postgres, entao o host nao
#    alcanca o banco como o README promete.
# 2. O container roda gunicorn com o codigo copiado na imagem: qualquer
#    alteracao exigiria rebuild. Em dev vale o runserver com o fonte montado.
# 3. O healthcheck do repo bate em /api/institutional/units/ (com barra), que
#    nao e rota — devolve 404 e o container nunca fica "healthy".
services:
  postgres:
    ports:
      - '${POSTGRES_PORT:-5464}:5432'

  api:
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/auth/me | grep -qE '200|403'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
