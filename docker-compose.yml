o que services:
  postgres:
    image: postgres:16-alpine
    container_name: api-sgcas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgcas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-sgcas}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sgcas} -d ${POSTGRES_DB:-sgcas}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-sgcas
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgcas}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-sgcas}
    ports:
      - '${API_PORT:-8000}:8000'
    volumes:
      - ./armazenamento:/app/armazenamento

volumes:
  pgdata:
